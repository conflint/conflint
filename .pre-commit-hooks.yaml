- id: conflint
  name: conflint
  description: "Run confl check (configuration drift linter) across the repository."
  entry: confl check
  language: python
  types: [python]
  require_serial: true
  pass_filenames: false

- id: ruff
  name: ruff
  description: "Run ruff linter (flake8 + isort + pyupgrade + more) on changed files."
  entry: ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  require_serial: true
  minimum_pre_commit_version: "2.9.2"

- id: ruff-format
  name: ruff-format
  description: "Run ruff formatter on staged Python files."
  entry: ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  require_serial: true
  minimum_pre_commit_version: "2.9.2"

- id: mypy
  name: mypy
  description: "Run mypy static type checker (strict) on the conflint source tree."
  entry: mypy
  language: python
  types: [python]
  require_serial: true
  additional_dependencies: ["types-PyYAML>=6.0"]